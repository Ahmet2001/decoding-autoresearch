[ollama]
base_url = "http://127.0.0.1:11434"
model = "qwen3.5:2b-q4_K_M"
context_length = 4096
output_tokens = 768
validation_output_tokens = 2048
timeout_seconds = 120.0
screen_seeds = [17]
validation_seeds = [17]
minimum_gpu_fraction = 0.90

[benchmark]
# Fast deterministic subset: bilingual loop stress plus exact completion checks,
# followed by four held-out validation cases never exposed to the TPE objective.
screen_case_ids = ["s-en-06", "s-tr-06", "s-en-03", "s-tr-03"]
validation_case_ids = ["v-en-10", "v-tr-10", "v-en-03", "v-tr-03"]

[deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"
temperature = 0.7
boss_max_tokens = 800
judge_max_tokens = 500
max_description_characters = 1200
# Deliberately conservative estimates. Update if official prices exceed these values.
input_usd_per_million_tokens = 2.0
output_usd_per_million_tokens = 8.0

[metrics]
ngram_size = 8
loop_fraction_threshold = 0.10
sentence_min_tokens = 6
loop_fraction_weight = 0.60
loop_incidence_weight = 0.20
truncation_weight = 0.10
reasoning_efficiency_weight = 0.10

[quality]
screen_relative_improvement = 0.05
validation_absolute_improvement = 0.01
max_judge_loss_rate = 0.10
quality_tolerance = 0.10
bootstrap_samples = 1000
bootstrap_confidence = 0.95

[run]
max_hours = 4.0
max_cost_usd = 1.0
max_boss_calls = 40
max_consecutive_failures = 3
history_limit = 8
# Baseline plus eight unique single-field candidates, then search pair interactions.
interaction_after_unique_configs = 9
# After enough pair experiments, allow a third field to recover answer completion
# while retaining a measured anti-loop anchor.
quality_recovery_after_unique_configs = 16

[algorithm]
sampler_seed = 20260714
startup_trials = 10
temperature_step = 0.05
top_p_step = 0.025
top_k_step = 5
min_p_step = 0.01
max_trials = 40

[decoding_search.temperature]
min = 0.5
max = 1.5

[decoding_search.top_p]
min = 0.70
max = 1.0

[decoding_search.top_k]
min = 5
max = 100

[decoding_search.min_p]
min = 0.0
max = 0.20
