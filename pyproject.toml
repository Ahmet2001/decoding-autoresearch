[project]
name = "qwen-decoding-autoresearch"
version = "0.1.0"
description = "Autonomous decoding research for Qwen 3.5 thinking-loop reduction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "optuna>=4.6,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
